<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  try {
    var t = localStorage.getItem('digen-theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #F4F6F0;
    --surface: #FCFDF9;
    --tint: #E9EEE1;
    --border: #DDE4D3;
    --border-strong: #C3CDB6;
    --text: #17211B;
    --text-2: #55615A;
    --text-3: #8C978E;
    --pine: #1E4D3A;
    --pine-hover: #153827;
    --on-pine: #FFFFFF;
    --leaf: #4F7A45;
    --dot: rgba(30, 77, 58, 0.12);
    --shadow: 0 1px 2px rgba(23, 33, 27, 0.06), 0 16px 40px rgba(30, 77, 58, 0.10);
    --max: 720px;
    --sans: 'Hanken Grotesk', -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }

  html[data-theme="dark"] {
      --bg: #10160F;
      --surface: #182019;
      --tint: #1C251D;
      --border: #263026;
      --border-strong: #3A473C;
      --text: #E9EEE5;
      --text-2: #A9B5A8;
      --text-3: #6E7C6F;
      --pine: #8FB694;
      --pine-hover: #A5C9AA;
      --on-pine: #122119;
      --leaf: #8FB694;
      --dot: rgba(255, 255, 255, 0.07);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 40px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  /* faint surveyor's dot-grid — the one texture in the whole page */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(var(--dot) 1px, transparent 1.3px);
    background-size: 22px 22px;
    pointer-events: none;
    z-index: 0;
    mask-image: linear-gradient(to bottom, black 30%, transparent 90%);
    -webkit-mask-image: linear-gradient(to bottom, black 30%, transparent 90%);
  }

  /* ---------- Header ---------- */
  header {
    height: 58px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid transparent;
    transition: background 0.2s, border-color 0.2s;
    z-index: 10;
    position: relative;
  }
  body.chatting header { background: var(--bg); border-bottom-color: var(--border); }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 6px 10px 6px 4px;
    border-radius: 9px;
  }
  .brand:hover { background: var(--tint); }

  .leaf { width: 24px; height: 24px; display: flex; animation: drift 6s ease-in-out infinite; }
  .leaf svg { width: 24px; height: 24px; }
  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-2px) rotate(-5deg); }
  }

  .brand b { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .brand em {
    font-family: var(--mono);
    font-style: normal;
    font-size: 10px;
    color: var(--text-3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    margin-left: 2px;
  }

  .top-right { display: flex; align-items: center; gap: 10px; }

  .new-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 8px 13px;
    cursor: pointer;
  }
  .new-btn:hover { border-color: var(--text-3); }
  .new-btn svg { width: 13px; height: 13px; }

  .avatar-btn {
    width: 31px;
    height: 31px;
    border-radius: 9px;
    border: 1px solid var(--border-strong);
    background: var(--pine);
    color: var(--on-pine);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }
  .avatar-btn:hover { background: var(--pine-hover); }

  .theme-btn {
    width: 31px;
    height: 31px;
    border-radius: 9px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .theme-btn:hover { color: var(--text); border-color: var(--text-3); }
  .theme-btn svg { width: 15px; height: 15px; }
  .theme-btn .sun { display: none; }
  html[data-theme="dark"] .theme-btn .sun { display: block; }
  html[data-theme="dark"] .theme-btn .moon { display: none; }

  /* ---------- Stage ---------- */
  .stage {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }
  .stage.empty { justify-content: center; padding-bottom: 9vh; }
  .stage.empty .msgs-wrap { display: none; }
  .stage.chatting { justify-content: flex-end; }
  .stage.chatting .greet { display: none; }
  .stage.chatting .index { display: none; }

  .greet { margin-bottom: 22px; animation: rise 0.5s ease-out; }
  .over {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-2);
    margin-bottom: 12px;
  }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--leaf); animation: pulse 2.4s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .greet h1 {
    font-size: clamp(30px, 5vw, 40px);
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1.08;
  }
  .greet h1 i { font-style: normal; color: var(--text-3); }
  .greet p { margin-top: 10px; font-size: 14.5px; color: var(--text-2); max-width: 46ch; }

  /* ---------- Entries (messages as logbook records) ---------- */
  .msgs-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 22px 2px 10px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .entry { animation: rise 0.3s ease-out; }
  .e-head {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 7px;
  }
  .e-head .rule { flex: 1; height: 1px; background: var(--border); }
  .e-head .copy {
    font-family: inherit; font-size: inherit; letter-spacing: inherit; text-transform: inherit;
    color: var(--text-3); background: none; border: none; cursor: pointer; padding: 2px 4px;
  }
  .e-head .copy:hover { color: var(--text); }

  .entry.user .e-body {
    background: var(--tint);
    border: 1px solid var(--border);
    border-radius: 4px 14px 14px 14px;
    padding: 12px 16px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-width: 92%;
  }
  .entry.agent .e-body {
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-width: 100%;
  }

  .typing-dots { display: none; gap: 5px; padding: 6px 0; }
  .typing-dots.show { display: flex; }
  .typing-dots i { width: 6px; height: 6px; background: var(--text-3); border-radius: 1px; animation: blink 1.2s infinite; }
  .typing-dots i:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- Composer: the "entry card" ---------- */
  .composer-block { flex-shrink: 0; padding: 10px 0 22px; }

  .composer {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .composer:focus-within { border-color: var(--pine); }

  .c-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 16px;
    border-bottom: 1px dashed var(--border);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .c-top .l { display: flex; align-items: center; gap: 7px; }
  .c-top .l::before { content: ''; width: 6px; height: 6px; background: var(--leaf); border-radius: 1px; }

  .composer textarea {
    width: 100%;
    border: none;
    background: transparent;
    resize: none;
    outline: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    padding: 14px 16px 4px;
    min-height: 56px;
    max-height: 200px;
    display: block;
  }
  .composer textarea::placeholder { color: var(--text-3); }

  .c-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px; }
  .attach {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-2); background: transparent;
    border: 1px solid transparent; border-radius: 8px;
    padding: 8px 10px; cursor: pointer;
  }
  .attach:hover { border-color: var(--border); color: var(--text); background: var(--tint); }
  .attach svg { width: 14px; height: 14px; }

  .c-hint {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-3);
    letter-spacing: 0.02em;
  }
  .c-hint b { font-weight: 500; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }

  .send {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    color: var(--text-2);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 16px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .send.ready { background: var(--pine); border-color: var(--pine); color: var(--on-pine); }
  .send.ready:hover { background: var(--pine-hover); }
  .send svg { width: 14px; height: 14px; }

  /* ---------- Starter index (not pills, not cards) ---------- */
  .index {
    margin-top: 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    overflow: hidden;
  }
  .index button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
  }
  .index button:last-child { border-bottom: none; }
  .index button:hover { background: var(--tint); }
  .index button i {
    font-family: var(--mono); font-style: normal;
    font-size: 11px; color: var(--text-3);
  }
  .index button svg { width: 14px; height: 14px; color: var(--text-3); margin-left: auto; flex-shrink: 0; }

  .fine { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 12px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }

  button:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }

  @media (max-width: 640px) {
    .brand em { display: none; }
    .c-hint { display: none; }
    .stage { padding: 0 12px; }
    .entry.user .e-body { max-width: 100%; }
    .e-head .copy { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    .leaf { animation: none; }
  }
</style>
</head>
<body>

<header>
  <button class="brand" id="brandBtn" aria-label="Digen home">
    <span class="leaf" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 21c-5 0-8-3.5-8-9 0-4 2.5-7.5 6.5-9C15 4.5 20 6 20 6s.6 5-1.5 9.5C16.5 19.5 14 21 12 21Z" fill="#4F7A45" opacity="0.18"/>
        <path d="M12 21c-5 0-8-3.5-8-9 0-4 2.5-7.5 6.5-9C15 4.5 20 6 20 6s.6 5-1.5 9.5C16.5 19.5 14 21 12 21Z" stroke="#4F7A45" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12 21C12 15 14.5 10.5 19 7.5" stroke="#4F7A45" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </span>
    <b>Digen</b><em>herbarium</em>
  </button>

  <div class="top-right">
    <button class="new-btn" id="newBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>
    <button class="theme-btn" id="themeBtn" title="Switch to dark" aria-label="Switch to dark theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="7" y2="7"/><line x1="17" y1="17" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="7" y2="17"/><line x1="17" y1="7" x2="19.1" y2="4.9"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="avatar-btn" title="Account" aria-label="Account">J</button>
  </div>
</header>

<main class="stage empty" id="stage">
  <div class="greet">
    <div class="over"><span class="pulse"></span><span id="dateline">Ready</span></div>
    <h1 id="greetTitle">Good evening<i>.</i></h1>
    <p>Open a new entry below — a question, a draft, a plan. Digen picks it up from there.</p>
  </div>

  <div class="msgs-wrap" id="msgs"></div>

  <div class="composer-block">
    <div class="composer">
      <div class="c-top">
        <span class="l">New entry</span>
        <span id="wc">0 words</span>
      </div>
      <textarea id="input" rows="1" placeholder="Write something worth keeping…" aria-label="Message Digen"></textarea>
      <div class="c-bar">
        <button class="attach" title="Attach file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          Attach
        </button>
        <span class="c-hint"><b>Enter</b> send · <b>Shift+Enter</b> newline</span>
        <button class="send" id="sendBtn">
          Send
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
        </button>
      </div>
    </div>

    <div class="index" id="index">
      <button data-q="Help me draft an outline for my essay">
        <i>01</i>Draft an outline<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
      </button>
      <button data-q="Explain a difficult concept in simple terms">
        <i>02</i>Explain something simply<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
      </button>
      <button data-q="Help me plan my week effectively">
        <i>03</i>Plan my week<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
      </button>
    </div>

    <div class="fine">Digen can make mistakes. Verify important details.</div>
  </div>
</main>

<script>
  const stage = document.getElementById('stage');
  const msgs = document.getElementById('msgs');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const wc = document.getElementById('wc');
  let n = 0;

  (function () {
    const d = new Date();
    const h = d.getHours();
    document.getElementById('greetTitle').innerHTML =
      (h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + '<i>.</i>';
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('dateline').textContent =
      days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ' · Ready';
  })();

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
  function timeNow() {
    return new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }
  function pad(num) { return String(num).padStart(2, '0'); }
  function scrollBottom() { msgs.scrollTop = msgs.scrollHeight; }

  function setChatting() {
    if (stage.classList.contains('empty')) {
      stage.classList.remove('empty');
      stage.classList.add('chatting');
      document.body.classList.add('chatting');
    }
  }
  function setEmpty() {
    stage.classList.add('empty');
    stage.classList.remove('chatting');
    document.body.classList.remove('chatting');
    msgs.innerHTML = '';
    n = 0;
  }

  function head(who, withCopy) {
    n += 1;
    return '<div class="e-head"><span>' + who + '</span><span>' + timeNow() +
      ' · Nº ' + pad(n) + '</span><span class="rule"></span>' +
      (withCopy ? '<button class="copy">Copy</button>' : '') + '</div>';
  }

  function addUser(text) {
    setChatting();
    const el = document.createElement('div');
    el.className = 'entry user';
    el.innerHTML = head('You', false) + '<div class="e-body">' + esc(text) + '</div>';
    msgs.appendChild(el);
    scrollBottom();
  }

  function addAgent(text) {
    const el = document.createElement('div');
    el.className = 'entry agent';
    el.innerHTML = head('Digen', true) + '<div class="e-body">' + esc(text) + '</div>';
    el.querySelector('.copy').addEventListener('click', (e) => {
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      e.currentTarget.textContent = 'Copied';
      setTimeout(() => { e.currentTarget.textContent = 'Copy'; }, 1200);
    });
    msgs.appendChild(el);
    scrollBottom();
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'entry agent';
    el.id = 'typingRow';
    n += 1;
    el.innerHTML = '<div class="e-head"><span>Digen</span><span>' + timeNow() +
      ' · Nº ' + pad(n) + '</span><span class="rule"></span></div>' +
      '<div class="typing-dots show"><i></i><i></i><i></i></div>';
    msgs.appendChild(el);
    scrollBottom();
  }
  function hideTyping() {
    const t = document.getElementById('typingRow');
    if (t) { t.remove(); n -= 1; }
  }

  function send(text) {
    const v = (text !== undefined ? text : input.value).trim();
    if (!v) return;
    addUser(v);
    input.value = '';
    autoresize();
    showTyping();
    setTimeout(() => {
      hideTyping();
      addAgent('Noted. Give me one more detail on the outcome you want and I will draft it with you.');
    }, 1100);
  }

  function autoresize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    const words = input.value.trim() ? input.value.trim().split(/\s+/).length : 0;
    wc.textContent = words + (words === 1 ? ' word' : ' words');
    sendBtn.classList.toggle('ready', !!input.value.trim());
  }

  input.addEventListener('input', autoresize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', () => send());

  document.querySelectorAll('#index button').forEach(b => {
    b.addEventListener('click', () => send(b.dataset.q));
  });

  function newChat() {
    setEmpty();
    input.value = '';
    autoresize();
    input.focus();
  }
  document.getElementById('newBtn').addEventListener('click', newChat);
  document.getElementById('brandBtn').addEventListener('click', newChat);

  const themeBtn = document.getElementById('themeBtn');
  function syncThemeLabel() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    themeBtn.title = dark ? 'Switch to light' : 'Switch to dark';
  }
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('digen-theme', next); } catch (e) {}
    syncThemeLabel();
  });
  syncThemeLabel();

  autoresize();
  setTimeout(() => input.focus(), 200);
</script>
</body>
</html>
